const ikony=["⭐","🍎","📚","💐","✏️","🎓"];
const kartka=document.getElementById("kartka");
const tekst=document.getElementById("tekst");
const olowek=document.getElementById("olowek");
const licznik=document.getElementById("licznik");
let numer=0;
let ostatni=-1;
let ile=0;
let ostatniZnak=null;

const czekaj=ms=>new Promise(r=>setTimeout(r,ms));

function naPoczatek(){
  ostatniZnak=null;
  olowek.style.transform="translate("+(tekst.offsetLeft-22)+"px,"+(tekst.offsetTop+34)+"px)";
}

function przesun(el){
  ostatniZnak=el;
  const k=kartka.getBoundingClientRect();
  const r=el.getBoundingClientRect();
  const x=Math.min(r.right-k.left,k.width-26);
  const y=r.bottom-k.top-6;
  olowek.style.transform="translate("+(x-25)+"px,"+(y-108)+"px)";
}

async function wypisz(cel,tresc,id){
  for(const slowo of tresc.split(" ")){
    const w=document.createElement("span");
    w.className="slowo";
    cel.appendChild(w);
    cel.appendChild(document.createTextNode(" "));
    for(const z of slowo){
      if(id!==numer)return false;
      const l=document.createElement("span");
      l.textContent=z;
      w.appendChild(l);
      przesun(l);
      await czekaj(38+Math.random()*40);
    }
    await czekaj(60);
  }
  return true;
}

function spadek(ilosc){
  for(let i=0;i<ilosc;i++){
    const el=document.createElement("div");
    el.className="spadek";
    el.textContent=ikony[Math.floor(Math.random()*ikony.length)];
    el.style.left=Math.random()*100+"vw";
    el.style.fontSize=(18+Math.random()*24)+"px";
    el.style.animationDuration=(3+Math.random()*3.5)+"s";
    el.style.animationDelay=(Math.random()*.8)+"s";
    el.style.setProperty("--obrot",(Math.random()*720-360)+"deg");
    document.body.appendChild(el);
    el.addEventListener("animationend",()=>el.remove());
  }
}

async function pisz(nowe){
  const id=++numer;
  const nowa=nowe||ostatni<0;
  tekst.innerHTML="";
  olowek.classList.remove("radosc");
  olowek.classList.add("pisze");
  naPoczatek();
  if(nowa){
    let los;
    do{los=Math.floor(Math.random()*zyczenia.length)}while(los===ostatni);
    ostatni=los;
    ile++;
    licznik.textContent="Napisane życzenia: "+ile;
  }
  await czekaj(350);
  if(!await wypisz(tekst,zyczenia[ostatni],id))return;
  olowek.classList.remove("pisze");
  void olowek.offsetWidth;
  olowek.classList.add("radosc");
  spadek(16);
}

olowek.addEventListener("click",()=>pisz(false));
document.getElementById("dalej").addEventListener("click",()=>pisz(true));
document.getElementById("kopiuj").addEventListener("click",async e=>{
  const przycisk=e.currentTarget;
  try{
    await navigator.clipboard.writeText(tekst.textContent.trim());
    przycisk.textContent="Skopiowano ✓";
  }catch(err){
    przycisk.textContent="Nie udało się";
  }
  setTimeout(()=>{przycisk.textContent="Kopiuj"},1500);
});
window.addEventListener("resize",()=>{
  if(ostatniZnak)przesun(ostatniZnak);else naPoczatek();
});

naPoczatek();
setTimeout(()=>pisz(true),800);
setInterval(()=>spadek(1),2200);
</script>
